name: Admin UI Deploy
permissions:
  id-token: write
  contents: write
  pull-requests: write
on:
  push:
    branches: [main]
    paths:
      - "frontends/ui/**"
      - ".github/workflows/admin.ui.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy to - for example, "dev" or "prod"'
        required: true
        default: 'dev'      
defaults:
  run:
    working-directory: ./frontends/admin

jobs:
  deploy:
    name: Deploy service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: |
            **/yarn.lock

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ github.event.inputs.stage == 'prod' && '707495320920' || '955644676078' }}:role/GithubActionsDeploymentRole
          aws-region: us-east-1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: SST Deploy - ${{ github.event.inputs.stage == '' && 'dev' || github.event.inputs.stage }}
        run: yarn deploy --stage=${{ github.event.inputs.stage == '' && 'dev' || github.event.inputs.stage }};
