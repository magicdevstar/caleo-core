name: Core PR

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/**"
      - ".github/workflows/core.pr.yml"
    
defaults:
  run:
    working-directory: ./backend/core

jobs:
  test:
    name: Test PR Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: |
            **/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Types
        run: yarn generate

      - name: Run Lint
        run: yarn lint

      - name: Run Unit tests
        run: yarn test:unit
