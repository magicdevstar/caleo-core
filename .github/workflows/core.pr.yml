name: Core PR

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/**"
      - ".github/workflows/core.pr.yml"
    
defaults:
  run:
    working-directory: ./backend/core

jobs:
  variables:
    runs-on: ubuntu-latest
    name: Set test environment variables
    outputs:
      sls_stage: ${{ steps.set-stage.outputs.sls_stage }}
    steps:
      - uses: actions/checkout@v3
      - name: Set stage variable
        id: set-stage
        run: |
          echo "sls_stage=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

  test:
    name: Test PR Environment
    runs-on: ubuntu-latest
    needs: variables
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: |
            **/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::955644676078:role/GithubActionsDeploymentRole
          aws-region: us-east-1

      - name: Generate Types
        run: yarn generate

      - name: Run Lint
        run: yarn lint

      - name: Run Unit tests
        run: yarn test:unit

      # - name: Deploy PR Environment
      #   run: yarn sls deploy --stage ${{ needs.variables.outputs.sls_stage }}

      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY }}
      #     aws-secret-access-key: ${{ secrets.DEV_AWS_ACCESS_SECRET_KEY }}
