name: Core Deploy
permissions:
  id-token: write
  contents: write
  pull-requests: write
env:
  RELEASE_PREFIX: 'chore(main): release'
on:
  push:
    branches: [main]
    paths:
      - "backend/core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        description: 'Select the target environment'
        required: true
        options:
          - 'dev'
          - 'prod'
        default: 'dev'
defaults:
  run:
    working-directory: ./backend/core

jobs:
  deploy:
    name: Deploy service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: |
            **/yarn.lock

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ github.event.inputs.stage == 'prod' && '707495320920' || '955644676078' }}:role/GithubActionsDeploymentRole
          aws-region: us-west-2

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Serverless deploy - ${{ github.event.inputs.stage == '' && 'dev' || github.event.inputs.stage }}
        if: ${{ !startsWith(github.event.head_commit.message, env.RELEASE_PREFIX) }}
        run: yarn deploy --stage=${{ github.event.inputs.stage == '' && 'dev' || github.event.inputs.stage }};
