name: Core Deploy
permissions:
  id-token: write
  contents: write
  pull-requests: write
env:
  RELEASE_PREFIX: 'chore(main): release'
on:
  push:
    branches: [main]
    paths:
      - "backend/core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy to - for example, "dev" or "prod"'
        required: true
        default: 'dev'      
defaults:
  run:
    working-directory: ./backend/core

jobs:
  deploy:
    name: Deploy service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'yarn'
          cache-dependency-path: |
            **/yarn.lock

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ github.event.inputs.stage == 'prod' && '707495320920' || '955644676078' }}:role/GithubActionsDeploymentRole
          aws-region: us-east-1

      - name: Install dependencies
        run: yarn install

      - name: Serverless deploy - ${{ github.event.inputs.stage == '' && 'dev' || github.event.inputs.stage }}
        if: ${{ !startsWith(github.event.head_commit.message, env.RELEASE_PREFIX) }}
        run: yarn deploy --stage=${{ github.event.inputs.stage == '' && 'dev' || github.event.inputs.stage }};

      - uses: google-github-actions/release-please-action@v3
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          release-type: node
          path: backend/core
          monorepo-tags: true
          package-name: core
          commit-search-depth: 50
          release-search-depth: 50

      - name: Configure Prod AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        if: ${{ steps.release.outputs.releases_created }}
        with:
          role-to-assume: arn:aws:iam::707495320920:role/GithubActionsDeploymentRole
          aws-region: us-east-1

      - name: Serverless deploy - Production
        if: ${{ steps.release.outputs.releases_created }}
        run: yarn deploy -s prod
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
