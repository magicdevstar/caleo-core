  notification(notification: UpsertNotification!): Notification
  removeNotification(id: String!): ID!
  seenNotifications(notificationIds: [String]!): Boolean
  readInAppNotifications(ids: [String], readAll: Boolean): Boolean
  removeInAppNotifications(ids: [String], removeAll: Boolean): Boolean

  # Lottery review site
  siteLock(input: UpsertSiteLock): SiteLock
  approveLottoAssignment(id: String!, shiftId: String!, userId: String!): Boolean
  rejectLottoAssignment(id: String!, shiftId: String!, userId: String!): Boolean
}
