###### START Notifications ######
  enum NotificationFrequency {
    ONCE
    ALWAYS
    UNTIL_EXPIRE
  }

  # These are notifications created by system admins
  type Notification {
    id: ID!
    title: String!
    body: String!
    active: Boolean!
    frequency: NotificationFrequency!
    expiration: String
    rankIds: [String]
    docType: DocType!
    orgId: String!
    createdById: String
    createdAt: String!
    updatedAt: String!
    removedAt: String
    modifiedById: String

    # This boolean will determine if the requesting user has seen the notification or not
    seen: Boolean
    createdBy: User
    org: Organization!
    ranks: [Rank]!
    memberNotification: MemberNotification
    modifiedBy: User
  }

  # These are notifications that will replace SMS notifications
  type InAppNotifications {
    id: ID!
    title: String!
    body: String!
    read: Boolean!
    # This is here so we what what kind of notification is being sent
    # that way on the frontend we can determine an action to take based on the type
    templateName: String!
    docType: DocType!
    orgId: String!
    userId: String!
    createdAt: String!
    updatedAt: String!
    removedAt: String
    meta: InAppNotificationMeta

    org: Organization!
    user: User!
  }

  type InAppNotificationMeta {
    eventId: String
    assignmentId: String
    shiftId: String
    rankId: String
    skillId: String
    venueId: String
    shiftBufferRequestId: String
  }

  type MemberNotification {
    id: ID!
    notificationId: String!
    userId: String!
    docType: DocType!
    lastSeen: String!

    notification: Notification!
    user: User!
  }

  input UpsertNotification {
    id: String
    title: String!
    body: String
    active: Boolean
    frequency: NotificationFrequency
    expiration: String
    rankIds: [String]
  }
###### END Notifications ######

