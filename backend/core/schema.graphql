    orgId: String!
    status: EventStatus!
    lotteryNumber: Int
    scheduledInterestList: String
    scheduledCloseInterestList: String
    interestListTransition: EventStatus
    scheduledFirstComeFirstServe: String
    notifyOnFirstComeFirstServe: Boolean
    notifyWhenFullyStaffed: Boolean
    docType: DocType!
    venueId: String!
    assignmentIds: [String]
    createdById: String
    createdAt: String!
    updatedAt: String!
    removedAt: String
    modifiedById: String

    venue: Venue
    org: Organization!
    assignments: [Assignment!]
    attachments: [String!]
    createdBy: User
    availableShifts: Int
    modifiedBy: User
    lotteryCounter: LotteryCounter
  }

