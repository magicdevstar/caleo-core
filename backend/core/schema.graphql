###### START Common ######
  enum DocType {
    USER
    ORGANIZATION
    RANK
    SKILL
    MEMBER_SKILL
    VENUE
    NOTIFICATION
    MEMBER_NOTIFICATION
  }
  enum DayOfWeek {
    SUNDAY
    MONDAY
    TUESDAY
    WEDNESDAY
    THURSDAY
    FRIDAY
    SATURDAY
  }
###### END Common ######

###### START User ######
  enum MemberTier {
    TIER_1
    TIER_2
  }

  enum MemberStatus {
    ACTIVE
    INACTIVE
    PENDING
    REMOVED
    DELETED
  }

  enum MemberRole {
    ADMIN
    MEMBER
  }

  type UserAvailability {
    dayOfWeek: DayOfWeek!
    unavailable: Boolean!
    startTime: String!
    endTime: String!
    userId: String!

    user: User
  }

  type Phone {
    number: String!
    receiveTexts: Boolean!
  }

  type Email {
    address: String!
    receiveEmails: Boolean!
  }

  type ContactInfo {
    primaryPhone: Phone!
    primaryEmail: Email!
    secondaryPhone: Phone
    secondaryEmail: Email
  }

  type Member {
    orgId: String!
    pNumber: String!
    role: MemberRole
    status: MemberStatus
    contactInfo: ContactInfo
    tier: MemberTier
    rankId: String
    memberSkillIds: [String]
    adminNote: String
    deactivationNote: String

    rank: Rank
    memberSkills: [MemberSkill]
    org: Organization
  }

  type User {
    id: ID!
    cognitoId: String!
    firstName: String!
    lastName: String!
    superAdmin: Boolean!
    createdAt: String!
    updatedAt: String!
    docType: DocType!
    member: Member!
  }

  input UpdateUser {
    id: ID!
    cognitoId: String!
    firstName: String!
    lastName: String!
    member: NewMember
  }

  input NewUser {
    cognitoId: String!
    firstName: String!
    lastName: String!
    member: NewMember!
  }

  input NewPhone {
    number: String!
    receiveTexts: Boolean!
  }

  input NewEmail {
    address: String!
    receiveEmails: Boolean!
  }

  input NewContactInfo {
    primaryPhone: NewPhone!
    primaryEmail: NewEmail!
    secondaryPhone: NewPhone
    secondaryEmail: NewEmail
  }

  input NewMember {
    orgId: String!
    pNumber: String!
    role: MemberRole
    tier: MemberTier
    rankId: String
    memberSkillIds: [String]
    adminNote: String
    status: MemberStatus
    deactivationNote: String
    contactInfo: NewContactInfo
  }
###### END User ######

###### START Events ######
  enum EventStatus {
    PENDING
    PRE_FCFS
    FCFS
    PRE_LOTTERY
    LOTTERY
    POST_LOTTERY
    IN_PROGRESS
    CLOSED
    REMOVED
  }

  type Event {
    id: ID!
    name: String!
    attachment: String!
    startDate: String!
    endDate: String!
    orgId: String!
    status: EventStatus!
    docType: DocType!
    assignmentIds: [String]

    org: Organization!
    assignments: [Assignment]
  }

  type Assignment {
    id: ID!
    name: String!
    description: String
    eventId: String!
    orgId: String!
    docType: DocType!
    requiredSkillIds: [String]
    rankIds: [String]
    bwNeeded: Boolean!
    shiftIds: [String]

    event: Event!
    requiredSkills: [Skill]
    ranks: [Rank]
    shifts: [Shift]
  }

  enum ShiftStatus {
    AVAILABLE
    PENDING
    ASSIGNED
    STARTED
    SECURED
    UNSECURED
    UNFULFILLED
    REMOVED
    RELINQUISHED
    LOCKED
  }

  type Shift {
    id: ID!
    shiftId: String!
    startTime: String!
    endTime: String!
    status: ShiftStatus!
    docType: DocType!
    locked: Boolean!
    eventId: String!
    assignmentId: String!
    userId: String!

    user: User!
    event: Event!
    assignment: Assignment!
  }
###### END Events ######

###### START Venues ######
  type VenueContact {
    firstName: String
    lastName: String
    email: String
    phone: String
  }

  enum VenueStatus {
    ACTIVE
    INACTIVE
    REMOVED
  }

  type Venue {
    id: ID!
    name: String!
    address: String!
    city: String!
    state: String!
    zip: String!
    phone: String!
    contact: VenueContact
    status: VenueStatus
    docType: DocType!
    orgId: String!
    createdAt: String!
    updatedAt: String!

    org: Organization!
  }

  input UpsertVenueContact {
    firstName: String
    lastName: String
    email: String
    phone: String
  }

  input UpsertVenue {
    id: ID!
    name: String!
    address: String
    city: String
    state: String
    zip: String
    phone: String
    contact: UpsertVenueContact
    status: VenueStatus
  }
###### END Venues ######

###### START Skill ######
  enum SkillStatus {
    APPROVED
    DENIED
    PENDING
  }

  type Skill {
    id: ID!
    name: String!
    active: Boolean!
    requiresAdminApproval: Boolean!
    requiresCert: Boolean!
    docType: DocType!
    orgId: String!
    rankOnlyIds: [String]
    createdAt: String!
    updatedAt: String!

    ranksOnly: [Rank]
    org: Organization!
  }

  type MemberSkill {
    id: ID!
    userId: String!
    imagePath: String!
    skillId: String!
    orgId: String!
    status: SkillStatus!
    docType: DocType!
    createdAt: String!
    updatedAt: String!

    skill: Skill!
    user: User
  }

  input UpsertSkill {
    id: String
    name: String
    active: Boolean
    requiresAdminApproval: Boolean
    requiresCert: Boolean
    rankOnlyIds: [String]
  }

  input UpsertMemberSkill {
    id: String
    imagePath: String
    status: SkillStatus
    skillId: String!
    userId: String!
  }
###### END Skill ######

###### START Rank ######
  type Rank {
    id: ID!
    name: String!
    active: Boolean!
    docType: DocType!
    orgId: String!
    createdAt: String!
    updatedAt: String!

    org: Organization
  }

  input UpsertRank {
    id: String
    name: String
    active: Boolean
  }
###### END Rank ######

###### START Organization ######
  type OrganizationContact {
    phone: String!
    email: String!
  }

  type Organization {
    id: ID!
    name: String!
    address: String!
    state: String!
    city: String!
    weekBegins: DayOfWeek!
    timezone: String!
    contact: OrganizationContact
    docType: DocType!
    createdAt: String!
    updatedAt: String!
  }

  input NewOrganizationContact {
    phone: String!
    email: String!
  }

  input NewOrganization {
    name: String!
    address: String!
    state: String!
    city: String!
    weekBegins: DayOfWeek!
    timezone: String!
    contact: NewOrganizationContact
  }
###### END Organization ######

###### START Notifications ######
  enum NotificationFrequency {
    ONCE
    ALWAYS
    UNTIL_EXPIRE
  }

  type Notification {
    id: ID!
    title: String!
    body: String!
    active: Boolean!
    frequency: NotificationFrequency!
    rankIds: [String]
    docType: DocType!
    orgId: String!
    createdById: String!
    createdAt: String!
    updatedAt: String!

    createdBy: User!
    org: Organization!
    ranks: [Rank]!
    memberNotification: MemberNotification
  }

  type MemberNotification {
    id: ID!
    notificationId: String!
    userId: String!
    docType: DocType!
    lastSeen: String!

    notification: Notification!
    user: User!
  }

  input UpsertNotification {
    id: String
    title: String!
    body: String
    active: Boolean
    frequency: NotificationFrequency
    rankIds: [String]
  }
###### END Notifications ######

###### START Pagination ######
  input SearchInput {
    limit: Int
    skip: Int
    query: Int
  }

  type RankSearchResult {
    items: [Rank]
    total: Int!
  }

  type SkillSearchResult {
    items: [Skill]
    total: Int!
  }

  type VenueSearchResult {
    items: [Venue]
    total: Int!
  }

  type NotificationSearchResult {
    items: [Notification]
    total: Int!
  }

  type UserSearchResult {
    items: [User]
    total: Int!
  }
###### END Pagination ######

type Query {
  health: String
  me: User

  users(input: SearchInput): UserSearchResult

  rank(id: String!): Rank
  ranks(input: SearchInput): RankSearchResult
  
  skill(id: String!): Skill
  skills(input: SearchInput): SkillSearchResult
  
  venue(id: String!): Venue
  venues(input: SearchInput): VenueSearchResult

  notification(id: String!): Notification
  notifications(input: SearchInput): NotificationSearchResult
  activeNotifications(input: SearchInput): NotificationSearchResult
}

type Mutation {
  organization(org: NewOrganization!): Organization

  newUser(user: NewUser!): User
  user(user: UpdateUser!): User

  rank(rank: UpsertRank!): Rank
  removeRank(id: String!): ID!

  skill(skill: UpsertSkill!): Skill
  removeSkill(id: String!): ID!
  userSkill(userSkill: UpsertMemberSkill!): MemberSkill
  removeUserSkill(id: String!): ID!

  venue(venue: UpsertVenue!): Venue
  removeVenue(id: String!): ID!

  notification(notification: UpsertNotification!): Notification
  removeNotification(id: String!): ID!
  seenNotifications(notificationIds: [String]!): Boolean
}
