###### START Events ######
  enum EventStatus {
    # Event that is being built and not ready for assignments
    DRAFT
    # Event that assigned to a lottery run
    READY_FOR_LOTTERY
    # Event is going to allow users to express interest for the event shifts
    # and will be assigned manually by the admin
    INTEREST_LIST
    # Event where shifts are available to sign up for whenever
    FIRST_COME_FIRST_SERVE
    # Event has removedAt set
    REMOVED
    # Event is past the end date
    COMPLETE

    # Computed statuses
    # Event that will appear in the next lottery run
    PRE_LOTTERY
    # Event that is staged for first come first serve but not yet available
    PRE_FIRST_COME_FIRST_SERVE
  }

  type EventAttachmentUpload {
    attachmentPath: String!
    uploadUrl: String!
  }

  type Event {
    id: ID!
    referenceId: String!
