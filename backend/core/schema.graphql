    # For the St Pete Demo. This might move to a different place once we get feedback
    callSign: String

    # When interest list will be available for officers
    scheduledInterestList: String
    # When the interest list will start automatically assigning officers
    scheduledCloseInterestList: String
    # When the interest list will stop automatically assigning officers
    interestListAutoAssignCutoff: String
    # What we should transition to after the auto assign cut off passes
    interestListTransition: EventStatus
    # Boolean stating if we want the interest list to auto assign when it closes
    autoAssignInterestList: Boolean

    scheduledFirstComeFirstServe: String
    notifyOnFirstComeFirstServe: Boolean
    notifyWhenFullyStaffed: Boolean
    requestDetails: EventRequestDetails
    docType: DocType!
    venueId: String!
    assignmentIds: [String]
