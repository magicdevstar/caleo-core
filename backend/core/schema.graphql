###### START Common ######
  enum DocType {
    USER
    ORGANIZATION
    RANK
    SKILL
    MEMBER_SKILL
    VENUE
    NOTIFICATION
    MEMBER_NOTIFICATION
    EVENT
    ASSIGNMENT
    SHIFT
    LOTTERY_COUNTER
    SHIFT_BUFFER_REQUEST
    SHIFT_LOTTERY_REQUEST
  }
  enum DayOfWeek {
    SUNDAY
    MONDAY
    TUESDAY
    WEDNESDAY
    THURSDAY
    FRIDAY
    SATURDAY
  }
###### END Common ######

###### START User ######
  enum MemberTier {
    TIER_1
    TIER_2
  }

  enum MemberStatus {
    ACTIVE
    INACTIVE
    PENDING
    REMOVED
    DELETED
  }

  enum MemberRole {
    ADMIN
    MEMBER
  }

  type AvailabilityTime {
    startTime: String!
    endTime: String!
  }

  type DayAvailability {
    available: Boolean!
    times: [AvailabilityTime!]
  }

  type UserAvailability {
    monday: DayAvailability!
    tuesday: DayAvailability!
    wednesday: DayAvailability!
    thursday: DayAvailability!
    friday: DayAvailability!
    saturday: DayAvailability!
    sunday: DayAvailability!
  }

  type Phone {
    number: String!
    receiveTexts: Boolean!
  }

  type Email {
    address: String!
    receiveEmails: Boolean!
  }

  type ContactInfo {
    primaryPhone: Phone!
    primaryEmail: Email!
    secondaryPhone: Phone
    secondaryEmail: Email
  }

  type Member {
    orgId: String!
    pNumber: String!
    role: MemberRole
    status: MemberStatus
    contactInfo: ContactInfo
    tier: MemberTier
    tierUntil: String
    rankId: String
    memberSkillIds: [String]
    adminNote: String
    deactivationNote: String
    maxShifts: Int

    availability: UserAvailability!
    rank: Rank
    memberSkills: [MemberSkill]
    org: Organization
  }

  type ProfilePhotoAttachmentUpload {
    imagePath: String!
    uploadUrl: String!
  }

  type User {
    id: ID!
    cognitoId: String!
    firstName: String!
    lastName: String!
    name: String!
    imagePath: String
    superAdmin: Boolean!
    createdAt: String!
    updatedAt: String!
    docType: DocType!
    member: Member!

    image: String
  }

  input InputAdminResetPassword {
    userId: String!
    password: String!
  }

  input InputAvailabilityTime {
    startTime: String!
    endTime: String!
  }

  input InputDayAvailability {
    available: Boolean!
    times: [InputAvailabilityTime!]
  }

  input InputUserAvailability {
    monday: InputDayAvailability!
    tuesday: InputDayAvailability!
    wednesday: InputDayAvailability!
    thursday: InputDayAvailability!
    friday: InputDayAvailability!
    saturday: InputDayAvailability!
    sunday: InputDayAvailability!
  }

  input UpdateUser {
    id: ID!
    cognitoId: String!
    firstName: String!
    lastName: String!
    imagePath: String
    member: NewMember
  }

  input NewUser {
    cognitoId: String!
    firstName: String!
    lastName: String!
    member: NewMember!
  }

  input NewPhone {
    number: String!
    receiveTexts: Boolean!
  }

  input NewEmail {
    address: String!
    receiveEmails: Boolean!
  }

  input NewContactInfo {
    primaryPhone: NewPhone!
    primaryEmail: NewEmail!
    secondaryPhone: NewPhone
    secondaryEmail: NewEmail
  }

  input NewMember {
    orgId: String!
    pNumber: String!
    role: MemberRole
    tier: MemberTier
    tierUntil: String
    rankId: String
    memberSkillIds: [String]
    adminNote: String
    status: MemberStatus
    maxShifts: Int
    deactivationNote: String
    contactInfo: NewContactInfo
    availability: InputUserAvailability
  }
###### END User ######

###### START Events ######
  enum EventStatus {
    DRAFT
    UPCOMING
    READY_FOR_LOTTERY
    FIRST_COME_FIRST_SERVE
    FIRST_COME_FIRST_SERVE_SCHEDULED
    COMPLETE
  }

  type EventAttachmentUpload {
    attachmentPath: String!
    uploadUrl: String!
  }

  type Event {
    id: ID!
    referenceId: String!
    name: String!
    attachmentPaths: [String]
    startTime: String
    endTime: String
    notes: String
    orgId: String!
    status: EventStatus!
    lotteryNumber: Int
    scheduledFirstComeFirstServe: String
    notifyWhenFullyStaffed: Boolean
    docType: DocType!
    venueId: String!
    assignmentIds: [String]
    createdById: String
    createdAt: String!
    updatedAt: String!

    venue: Venue
    org: Organization!
    assignments: [Assignment!]
    attachments: [String!]
    createdBy: User
    availableShifts: Int
  }

  type Assignment {
    id: ID!
    name: String!
    description: String
    eventId: String!
    orgId: String!
    notifyWhenFullyStaffed: Boolean
    docType: DocType!
    requiredSkillIds: [String]
    rankIds: [String]
    bwNeeded: Boolean!
    shiftIds: [String]
    createdAt: String!
    updatedAt: String!

    event: Event!
    requiredSkills: [Skill]
    ranks: [Rank]
    shifts: [Shift]
    org: Organization!
  }

  enum ShiftStatus {
    AVAILABLE
    ASSIGNED
  }

  enum ShiftBufferRequestStatus {
    APPROVED
    REJECTED
    PENDING
  }

  type ShiftDayTime {
    startTime: String!
    endTime: String!
  }

  type ShiftAvailabilityTime {
    monday: ShiftDayTime
    tuesday: ShiftDayTime
    wednesday: ShiftDayTime
    thursday: ShiftDayTime
    friday: ShiftDayTime
    saturday: ShiftDayTime
    sunday: ShiftDayTime
  }

  type ShiftBufferRequest {
    id: ID!
    shiftId: String!
    shiftGroupId: String!
    shiftBufferShiftId: String!
    eventId: String!
    assignmentId: String!
    startTime: String!
    endTime: String!
    status: ShiftBufferRequestStatus!
    orgId: String!
    userId: String!
    note: String
    reason: String
    createdAt: String!
    updatedAt: String!

    user: User
    shift: Shift!
    shiftBufferShift: Shift!
    event: Event!
    assignment: Assignment!
    org: Organization!
  }

  type ShiftLotteryRequest {
    id: ID!
    shiftGroupId: String!
    eventId: String!
    assignmentId: String!
    orgId: String!
    order: Int
    userId: String!
    lotteryCounter: Int!
    createdAt: String!
    updatedAt: String!

    user: User
    event: Event!
    assignment: Assignment!
    org: Organization!
    shift: Shift
  }

  type Shift {
    id: ID!
    shiftId: String!
    startTime: String!
    endTime: String!
    status: ShiftStatus!
    docType: DocType!
    orgId: String!
    locked: Boolean
    relinquishNote: String
    eventId: String!
    assignmentId: String!
    userId: String
    createdById: String
    createdAt: String!
    updatedAt: String!
    availability: ShiftAvailabilityTime
    notificationId: String

    # This will be included when searching for shifts
    shiftBufferShift: Shift
    # This field will only be included on otherShiftSlots
    order: Int
    lotteryRequest: ShiftLotteryRequest
    otherShiftSlots: [Shift]
    user: User
    event: Event!
    assignment: Assignment!
    org: Organization!
    createdBy: User
  }

  input UpsertEvent {
    id: String
    name: String!
    attachmentPaths: [String]
    status: EventStatus
    lotteryNumber: Int
    scheduledFirstComeFirstServe: String
    notes: String
    venueId: String!
    notifyWhenFullyStaffed: Boolean
    assignmentIds: [String]!
    createdById: String
  }

  input CreateShiftBufferRequest {
    shiftId: String!
    shiftBufferShiftId: String!
    userId: String!
    note: String
  }

  input UpsertShiftLotteryRequest {
    id: String
    shiftGroupId: String!
    userId: String!
    order: Int
  }

  input UpsertAssignment {
    id: String
    name: String!
    description: String
    eventId: String!
    notifyWhenFullyStaffed: Boolean
    requiredSkillIds: [String]
    rankIds: [String]
    bwNeeded: Boolean
    shiftIds: [String]
  }

  input UpsertShift {
    id: String
    shiftId: String!
    startTime: String!
    endTime: String!
    status: ShiftStatus
    locked: Boolean
    eventId: String!
    assignmentId: String!
    userId: String
    createdById: String
  }
###### END Events ######

###### START LotteryCounter ######
  type LotteryCounter {
    id: ID!
    counter: Int!
    orgId: String!
    docType: DocType!
    createdAt: String!
    updatedAt: String!

    org: Organization!
    
  }
###### END LotteryCounter ######

###### START Venues ######
  type VenueContact {
    firstName: String
    lastName: String
    email: String
    phone: String
  }

  enum VenueStatus {
    ACTIVE
    INACTIVE
    REMOVED
  }

  type Venue {
    id: ID!
    name: String!
    address: String
    city: String
    state: String
    zip: String
    phone: String
    notes: String
    contact: VenueContact
    status: VenueStatus
    docType: DocType!
    orgId: String!
    createdAt: String!
    updatedAt: String!

    org: Organization!
  }

  input UpsertVenueContact {
    firstName: String
    lastName: String
    email: String
    phone: String
  }

  input UpsertVenue {
    id: String
    name: String!
    address: String
    city: String
    state: String
    zip: String
    phone: String
    notes: String
    contact: UpsertVenueContact
    status: VenueStatus
  }
###### END Venues ######

###### START Skill ######
  enum SkillStatus {
    APPROVED
    DENIED
    PENDING
  }

  type Skill {
    id: ID!
    name: String!
    active: Boolean!
    requiresAdminApproval: Boolean!
    requiresCert: Boolean!
    docType: DocType!
    orgId: String!
    rankOnlyIds: [String]
    createdAt: String!
    updatedAt: String!

    ranksOnly: [Rank]
    org: Organization!
  }

  type MemberSkillAttachmentUpload {
    imagePath: String!
    uploadUrl: String!
  }

  type MemberSkill {
    id: ID!
    userId: String!
    imagePath: String!
    skillId: String!
    orgId: String!
    status: SkillStatus!
    statusReason: String
    docType: DocType!
    createdAt: String!
    updatedAt: String!

    skill: Skill!
    user: User
    # Download url for the image
    image: String
  }

  input UpsertSkill {
    id: String
    name: String
    active: Boolean
    requiresAdminApproval: Boolean
    requiresCert: Boolean
    rankOnlyIds: [String]
  }

  input UpsertMemberSkill {
    id: String
    imagePath: String
    status: SkillStatus
    statusReason: String
    skillId: String!
    userId: String!
  }
###### END Skill ######

###### START Rank ######
  type Rank {
    id: ID!
    name: String!
    active: Boolean!
    docType: DocType!
    orgId: String!
    createdAt: String!
    updatedAt: String!

    org: Organization
  }

  input UpsertRank {
    id: String
    name: String
    active: Boolean
  }
###### END Rank ######

###### START Organization ######
  type OrganizationContact {
    phone: String!
    email: String!
  }

  enum ShiftReminderUnit {
    MINUTE
    HOUR
    DAY
  }

  type Organization {
    id: ID!
    name: String!
    address: String!
    state: String!
    city: String!
    zip: String!
    weekBegins: DayOfWeek!
    timezone: String!
    contact: OrganizationContact
    docType: DocType!
    createdAt: String!
    updatedAt: String!
    settings: OrganizationOvertimeSettings
  }

  type OrganizationOvertimeSettings {
    shiftsPerWeek: Int!
    lottery: LotterySettings!
    shiftBuffer: ShiftBuffer!
    userRelinquishShift: UserRelinquishShift!
    shiftReminder: ShiftReminder!
  }

  type UserRelinquishShift {
    enabled: Boolean!
    # Number of hours to wait before shift starts to allow users to relinquish their shift
    numberOfHoursBeforeShift: Int!
    afterShiftRemove: AfterShiftRemove!
    requireNoteWhenRelinquishing: Boolean!
  }

  type ShiftBuffer {
    enabled: Boolean!
    minuteShiftBuffer: Int!
    adminOverrideShiftBuffer: Boolean!
  }

  type ShiftReminder {
    enabled: Boolean!
    # Number of hours before shift to send reminder
    time: Int!
    unit: ShiftReminderUnit!
  }

  # What tier should members be moved to if they relinquish their shift
  # and for how long
  type AfterShiftRemove {
    tier: MemberTier!
    days: Int!
  }

  type LotterySettings {
    enabled: Boolean!
    # The number of hours to notify users before the lottery window closes
    notifyUsersBeforeClose: Int!
    # Number of hours to wait before showing FCFS shifts
    fcfsShiftsDelay: Int!
    open: LotteryDate!
    close: LotteryDate!
  }

  type LotteryDate {
    dayOfWeek: DayOfWeek!
    ## This will be a full ISO string but we will only
    ## use the hour and minute portion of the ISO
    time: String!
  }

  input UpsertOrganizationContact {
    phone: String!
    email: String!
  }

  input UpsertOrganization {
    id: String
    name: String
    address: String
    state: String
    city: String
    zip: String
    weekBegins: DayOfWeek
    timezone: String
    contact: UpsertOrganizationContact
    settings: UpsertOrganizationOvertimeSettings
  }

  input UpsertOrganizationOvertimeSettings {
    shiftsPerWeek: Int!
    lottery: UpsertLotterySettings!
    shiftBuffer: UpsertShiftBuffer!
    userRelinquishShift: UpsertUserRelinquishShift!
    shiftReminder: UpsertShiftReminder!
  }

  input UpsertUserRelinquishShift {
    enabled: Boolean!
    # Number of hours to wait before shift starts to allow users to relinquish their shift
    numberOfHoursBeforeShift: Int!
    afterShiftRemove: UpsertAfterShiftRemove!
    requireNoteWhenRelinquishing: Boolean!
  }

  input UpsertShiftBuffer {
    enabled: Boolean!
    minuteShiftBuffer: Int!
    adminOverrideShiftBuffer: Boolean!
  }

  input UpsertShiftReminder {
    enabled: Boolean!
    # Number of hours before shift to send reminder
    time: Int!
    unit: ShiftReminderUnit!
  }

  # What tier should members be moved to if they relinquish their shift
  # and for how long
  input UpsertAfterShiftRemove {
    tier: MemberTier!
    days: Int!
  }

  input UpsertLotterySettings {
    enabled: Boolean!
    # The number of hours to notify users before the lottery window closes
    notifyUsersBeforeClose: Int!
    # Number of hours to wait before showing FCFS shifts
    fcfsShiftsDelay: Int!
    open: UpsertLotteryDate!
    close: UpsertLotteryDate!
  }

  input UpsertLotteryDate {
    dayOfWeek: DayOfWeek!
    ## This will be a full ISO string but we will only
    ## use the hour and minute portion of the ISO
    time: String!
  }
###### END Organization ######

###### START Notifications ######
  enum NotificationFrequency {
    ONCE
    ALWAYS
    UNTIL_EXPIRE
  }

  type Notification {
    id: ID!
    title: String!
    body: String!
    active: Boolean!
    frequency: NotificationFrequency!
    expiration: String
    rankIds: [String]
    docType: DocType!
    orgId: String!
    createdById: String
    createdAt: String!
    updatedAt: String!

    # This boolean will determine if the requesting user has seen the notification or not
    seen: Boolean
    createdBy: User
    org: Organization!
    ranks: [Rank]!
    memberNotification: MemberNotification
  }

  type MemberNotification {
    id: ID!
    notificationId: String!
    userId: String!
    docType: DocType!
    lastSeen: String!

    notification: Notification!
    user: User!
  }

  input UpsertNotification {
    id: String
    title: String!
    body: String
    active: Boolean
    frequency: NotificationFrequency
    expiration: String
    rankIds: [String]
  }
###### END Notifications ######

###### START Pagination ######
  input SearchInput {
    limit: Int
    skip: Int
    query: String
    orderBy: String
    order: String
  }

  input RankSearchInput {
    limit: Int
    skip: Int
    query: String
    active: Boolean
    orderBy: String
    order: String
  }

  type RankSearchResult {
    items: [Rank]
    total: Int!
  }

  input MemberSkillSearchInput {
    limit: Int
    skip: Int
    status: String
    orderBy: String
    order: String
  }

  type MemberSkillSearchResult {
    items: [MemberSkill]
    total: Int!
  }

  input SkillSearchInput {
    limit: Int
    skip: Int
    query: String
    requiresCert: Boolean
    rankOnlyIds: [String]
    requiresAdminApproval: Boolean
    active: Boolean
    orderBy: String
    order: String
  }

  type SkillSearchResult {
    items: [Skill]
    total: Int!
  }

  input VenueSearchInput {
    limit: Int
    skip: Int
    query: String
    status: [String]
    orderBy: String
    order: String
  }

  type VenueSearchResult {
    items: [Venue]
    total: Int!
  }

  type EventSearchResult {
    items: [Event]
    total: Int!
  }

  input EventTimeFilter {
    gte: String
    lte: String
    value: String
  }

  input EventSearchInput {
    limit: Int
    skip: Int
    query: String
    startTime: EventTimeFilter
    endTime: EventTimeFilter
    orderBy: String
    order: String
  }

  type AssignmentSearchResult {
    items: [Assignment]
    total: Int!
  }

  input ShiftSearchInput {
    limit: Int
    skip: Int
    userId: String
    startTime: String
    endTime: String
    orderBy: String
    order: String
  }

  type ShiftSearchResult {
    items: [Shift]
    total: Int!
  }

  input ShiftBufferRequestsSearchInput {
    limit: Int
    skip: Int
    query: String
    orderBy: String
    order: String
    status: String
    userId: String
    startTime: String
    endTime: String
  }

  type ShiftBufferRequestsSearchResult {
    items: [ShiftBufferRequest]
    total: Int!
  }

  type ShiftLotteryRequestsSearchResult {
    items: [ShiftLotteryRequest]
    total: Int!
  }

  type NotificationSearchResult {
    items: [Notification]
    total: Int!
  }

  input NotificationSearchInput {
    limit: Int
    skip: Int
    query: String
    active: Boolean
    orderBy: String
    order: String
  }

  type UserSearchResult {
    items: [User]
    total: Int!
  }

  input UserSearchInput {
    limit: Int
    skip: Int
    query: String
    queryField: String
    pNumber: String
    phone: String
    email: String
    excludeIds: [String]
    rankIds: [String]
    statuses: [MemberStatus]
    skillIds: [String]
    tiers: [MemberTier]
    admin: Boolean
    orderBy: String
    order: String
  }
###### END Pagination ######

type Query {
  health: String
  me: User
  organization: Organization

  users(input: UserSearchInput): UserSearchResult
  user(id: String!): User

  rank(id: String!): Rank
  ranks(input: RankSearchInput): RankSearchResult
  
  skill(id: String!): Skill
  skills(input: SkillSearchInput): SkillSearchResult
  memberSkills(input: MemberSkillSearchInput): MemberSkillSearchResult
  
  venue(id: String!): Venue
  venues(input: VenueSearchInput): VenueSearchResult

  event(id: String!): Event
  events(input: EventSearchInput): EventSearchResult

  assignment(id: String!): Assignment
  assignments(input: SearchInput): AssignmentSearchResult

  availableShifts(input: SearchInput): ShiftSearchResult
  shift(id: String!): Shift
  groupedShifts(shiftId: String!): [Shift]
  shifts(input: ShiftSearchInput): ShiftSearchResult
  lotteryShifts: ShiftSearchResult
  shiftUsers(id: String!, name: String): UserSearchResult
  shiftBufferRequests(input: ShiftBufferRequestsSearchInput): ShiftBufferRequestsSearchResult
  shiftLotteryRequests: ShiftLotteryRequestsSearchResult

  lotteryCounter: LotteryCounter

  notification(id: String!): Notification
  notifications(input: NotificationSearchInput): NotificationSearchResult
  activeNotifications(input: SearchInput): NotificationSearchResult
}

type Mutation {
  organization(organization: UpsertOrganization!): Organization

  newUser(user: NewUser!): User
  user(user: UpdateUser!): User
  removeUser(id: String!): ID!
  profilePhotoUploadUrl: ProfilePhotoAttachmentUpload
  adminEditPassword(input: InputAdminResetPassword!): Boolean

  rank(rank: UpsertRank!): Rank
  removeRank(id: String!): ID!

  skill(skill: UpsertSkill!): Skill
  removeSkill(id: String!): ID!
  userSkill(userSkill: UpsertMemberSkill!): MemberSkill
  removeUserSkill(id: String!): ID!
  userSkillAttachmentUploadUrl: MemberSkillAttachmentUpload

  venue(venue: UpsertVenue!): Venue
  removeVenue(id: String!): ID!

  event(event: UpsertEvent!): Event
  eventAttachmentUploadUrl: EventAttachmentUpload
  removeEvent(id: String!): ID!

  assignment(assignment: UpsertAssignment!): Assignment
  removeAssignment(id: String!): ID!

  shifts(shifts: [UpsertShift]!): [Shift]
  removeShift(id: String!): ID!
  removeShifts(shiftId: String!): [String]!
  shiftAssign(id: String!, userId: String, note: String): Shift
  shiftBufferRequest(shiftBufferRequest: CreateShiftBufferRequest): ShiftBufferRequest
  setShiftBufferStatus(id: String!, status: ShiftBufferRequestStatus!, reason: String): ShiftBufferRequest
  shiftLotteryRequest(shiftLotteryRequest: UpsertShiftLotteryRequest): ShiftLotteryRequest
  removeShiftLotteryRequest(id: String): ID!
  notifyUsersOfShift(shiftId: String!): Boolean
  removeShiftBufferRequest(id: String!): ID!

  notification(notification: UpsertNotification!): Notification
  removeNotification(id: String!): ID!
  seenNotifications(notificationIds: [String]!): Boolean
}
