service: caleo-core
frameworkVersion: '3'

params:
  default:
    dbName: caleo-dev
  prod:
    dbName: caleo-prod

provider:
  name: aws
  runtime: nodejs18.x
  region: us-west-2
  logRetentionInDays: 3
  environment:
    STAGE: ${sls:stage}
    MONGODB_URI: ${ssm:/caleo/mongoURI}
    MONGODB_NAME: ${param:dbName}
    MONGODB_COLLECTION: core

plugins:
  - serverless-esbuild

package:
  patterns:
    - schema.graphql

custom:
  esbuild:
    bundle: true
    minify: false
    packager: yarn

# Create the authorizer
# Create a hook that will create a user when a new user signs up
functions:
  graphql:
    handler: src/index.handler
    events:
      - httpApi:
          path: /
          method: POST
      - httpApi:
          path: /
          method: GET
