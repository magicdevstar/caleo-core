service: caleo-core
frameworkVersion: '3'

params:
  default:
    dbName: caleo-dev
    poolName: lvmpd-oms-uat
    poolId: us-west-2_8023dPQwv
    serviceId: fa563217-bf80-4c84-a658-2aff5d870d4f
    bucketName: caleo-docs-${sls:stage}
    domainName: dev-api.caleopro.com
    pinpointId: d169e35fcb7d4f06b26da89e5650905a
    fromEmail: support@dev.caleopro.com
    LOG_LEVEL: info
    LOG_SAMPLE_RATE: 1
    ENABLED_ALERTS: 'false'
    appUrl: https://dev.caleopro.com
    loginUrl: https://dev.caleopro.com/auth/login
    registerUrl: https://dev.caleopro.com/auth/register
  prod:
    dbName: caleo-prod
    poolName: lvmpd-oms-prod
    poolId: us-west-2_3enNflKSo
    domainName: api.caleopro.com
    pinpointId: ff5f1d58543f4fd78ee3c3c1b6588921
    fromEmail: lvmpd@caleopro.com
    LOG_LEVEL: warn
    LOG_SAMPLE_RATE: 0
    ENABLED_ALERTS: 'true'
    appUrl: https://app.caleopro.com
    loginUrl: https://app.caleopro.com/auth/login
    registerUrl: https://app.caleopro.com/auth/register

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  versionFunctions: false
  logRetentionInDays: 3
  httpApi:
    cors: true
    authorizers:
      customAuthorizer:
        type: request
        functionName: authorizerFunc
        enableSimpleResponses: true
        payloadVersion: '2.0'
        identitySource:
          - $request.header.Authorization
          - $request.header.authorization
  environment:
    STAGE: ${sls:stage}
    REGION: ${aws:region}
    COGNITO_POOL_ID: ${param:poolId}
    MONGODB_URI: ${ssm:/caleo/mongoURI}
    BROWSER_PUBLIC_KEY: ${ssm:/caleo/browserPublicKey}
    BROWSER_PRIVATE_KEY: ${ssm:/caleo/browserPrivateKey}
    MONGODB_NAME: ${param:dbName}
    MONGODB_COLLECTION: core
    SERVICE_ID: ${param:serviceId}
    BUCKET_NAME: ${param:bucketName}
    SCHEDULED_LAMBDA_ARN: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-scheduledEvents
    LOTTO_STEP_FUNCTION_ARN: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:lotto-steps-${sls:stage}
    SHIFT_NOTIFICATION_SCHEDULER: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-shiftNotificationScheduler
    MAILER_LAMBDA: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-mailer
    SCHEDULED_ROLE_ARN: !GetAtt SchedulerRole.Arn
    PINPOINT_ID: ${param:pinpointId}
    FROM_EMAIL: ${param:fromEmail}
    LOGIN_URL: ${param:loginUrl}
    REGISTER_URL: ${param:registerUrl}
    APP_URL: ${param:appUrl}
    LOG_LEVEL: ${param:LOG_LEVEL}
    LOG_SAMPLE_RATE: ${param:LOG_SAMPLE_RATE}
    SLACK_TOKEN: ${ssm:/caleo/slackToken}
    ENABLED_ALERTS: ${param:ENABLED_ALERTS}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 's3:*'
            - 'lambda:*'
            - 'iam:PassRole'
            - 'scheduler:*'
            - 'states:*'
            - 'mobiletargeting:*'
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminUpdateUserAttributes
          Resource: '*'

plugins:
  - serverless-esbuild
  - serverless-domain-manager
  - serverless-step-functions

package:
  patterns:
    - schema.graphql

custom:
  customDomain:
    domainName: ${param:domainName}
    basePath: ${sls:stage}/graphql
    certificateName: ${param:domainName}
    createRoute53Record: true
    autoDomain: true
    endpointType: regional
    apiType: http
  esbuild:
    bundle: true
    minify: false
    packager: yarn
    external:
      - 'saslprep'
    exclude:
      - '@aws-sdk'

# Create the authorizer
# Create a hook that will create a user when a new user signs up
functions:
  # testFun:
  #   handler: src/workers/test.handler
  # GQL API
  authorizerFunc:
    handler: src/auth/authorizer.handler
  graphql:
    handler: src/index.handler
    memorySize: 2048
    timeout: 15
    events:
      - httpApi:
          path: /
          method: POST
          authorizer:
            name: customAuthorizer
      - httpApi:
          path: /
          method: GET
  getVenues:
    handler: src/public/getVenues.handler
    timeout: 15
    events:
      - httpApi:
          path: /public/venues
          method: GET
  eventRequest:
    handler: src/public/eventRequest.handler
    timeout: 15
    events:
      - httpApi:
          path: /public/event
          method: POST

  uiErrors:
    handler: src/uiErrors.handler
    events:
      - httpApi:
          path: /errors
          method: POST
          authorizer:
            name: customAuthorizer

  # Register Cognito User Hook
  registerUser:
    handler: src/workers/register.handler
    events:
      - cognitoUserPool:
          pool: ${param:poolName}
          trigger: PostConfirmation
          existing: true
          forceDeploy: true

  # Scheduled Tasks
  scheduledEvents:  
    handler: src/scheduled/scheduledEvents.handler

  # Lotto Step Function
  fetchShifts:
    handler: src/steps/fetchShifts.handler
    memorySize: 2048
    timeout: 300
  assignShift:
    handler: src/steps/assignShift.handler
    memorySize: 2048
    timeout: 300
  finalizeLottery:
    handler: src/steps/finalizeLottery.handler
    timeout: 300
  postFCFSShifts:
    handler: src/steps/postFCFSShifts.handler
    timeout: 300
  lotteryAnalytics:
    handler: src/steps/lotteryAnalytics.handler
    timeout: 300

  shiftNotificationScheduler:
    handler: src/workers/shiftNotificationScheduler.handler
    timeout: 300
  mailer:
    handler: src/workers/mailer.handler
    memorySize: 2048
    timeout: 300

  # Data sync functions
  memberStatusSync:
    handler: src/steps/memberStatusSync.handler
    timeout: 300
  tierResetSync:
    handler: src/steps/tierResetSync.handler
    timeout: 300
  markEventAsComplete:
    handler: src/steps/markEventAsComplete.handler
    timeout: 300
  checkoutNotifications:
    handler: src/steps/checkoutNotifications.handler
    timeout: 300

  # Test function
  scheduleTask:
    handler: src/scheduled/test.handler

resources:
  Resources:
    SchedulerRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - scheduler.amazonaws.com
              Action:
                - 'sts:AssumeRole'
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaRole
    DocumentBucket:
      Type: 'AWS::S3::Bucket'
      Properties:
        BucketName: ${param:bucketName}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
              AllowedOrigins:
                - '*'

stepFunctions:
  stateMachines:
    lottoSteps:
      name: lotto-steps-${sls:stage}
      definition:
        StartAt: FetchShifts
        States:
          FetchShifts:
            Type: Task
            Resource:
              Fn::GetAtt: [fetchShifts, Arn]
            Next: AssignShifts
          AssignShifts:
            Type: Map
            MaxConcurrency: 1
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: AssignShift
              States:
                AssignShift:
                  Type: Task
                  Resource:
                    Fn::GetAtt: [assignShift, Arn]
                  End: true
            Next: FinalizeLottery
          FinalizeLottery:
            Type: Task
            Resource:
              Fn::GetAtt: [finalizeLottery, Arn]
            Next: FCFSDelay
          FCFSDelay:
            Type: Wait
            TimestampPath: $.fcfsDelay
            Next: ParallelFCFSDelay
          ParallelFCFSDelay:
            Type: Parallel
            End: true
            Branches:
              - StartAt: PostFCFSShifts
                States:
                  PostFCFSShifts:
                    Type: Task
                    Resource:
                      Fn::GetAtt: [postFCFSShifts, Arn]
                    End: true
              - StartAt: LotteryAnalytics
                States:
                  LotteryAnalytics:
                    Type: Task
                    Resource:
                      Fn::GetAtt: [lotteryAnalytics, Arn]
                    End: true
    timeSync:
      name: time-sync-${sls:stage}
      events:
        - schedule: rate(1 hour)
      definition:
        StartAt: Parallel
        States:
          Parallel:
            Type: Parallel
            End: true
            Branches:
              - StartAt: MemberStatusSync
                States:
                  MemberStatusSync:
                    Type: Task
                    Resource:
                      Fn::GetAtt: [memberStatusSync, Arn]
                    End: true
              - StartAt: TierResetSync
                States:
                  TierResetSync:
                    Type: Task
                    Resource:
                      Fn::GetAtt: [tierResetSync, Arn]
                    End: true
              - StartAt: CheckoutNotifications
                States:
                  CheckoutNotifications:
                    Type: Task
                    Resource:
                      Fn::GetAtt: [checkoutNotifications, Arn]
                    End: true
              - StartAt: MarkAsComplete
                States:
                  MarkAsComplete:
                    Type: Task
                    Resource:
                      Fn::GetAtt: [markEventAsComplete, Arn]
                    End: true
  validate: true
